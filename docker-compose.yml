services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: agnivision-backend
    env_file:
      - ./backend/.env
    ports:
      - "8001:8001"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: agnivision-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
